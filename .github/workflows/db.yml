# Wgrywa supabase/support-schema.sql po każdym pushu, który go zmienia.
#
# Ta sama zasada co w dasdvwes-app/.github/workflows/db.yml: cały plik w jednej
# transakcji, sekret SUPABASE_DB_URL, bez sekretu job jest pomijany.
#
# Kolejność ma znaczenie: ten plik czyta tabele z schematu aplikacji
# (`entitlements`, `payments`, `dietitians`), więc schemat aplikacji musi być
# wgrany pierwszy. Zwykle jest — zmienia się częściej.
name: db

on:
  push:
    branches: [main]
    paths:
      - supabase/support-schema.sql
      - supabase/status-schema.sql
      - .github/workflows/db.yml
  workflow_dispatch:

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip without a database secret
        id: gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set — skipping." && echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply support-schema.sql and status-schema.sql
        if: steps.gate.outputs.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        run: |
          for f in supabase/support-schema.sql supabase/status-schema.sql; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --quiet -f "$f"
            echo "$f applied."
          done
