<!DOCTYPE html>
<!-- The practice panel's own door. Same panel as /staff (public/staff/app.js reads the address and speaks to dietitians here, in Polish or English); the page exists so a practice has a URL that says what it is. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<title>Plately dla dietetyków</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/staff/support.css?v=23">
<script>
  // Before first paint, or the panel flashes white on a dark desk at 2am.
  document.documentElement.dataset.theme = localStorage.getItem('plately_support_theme') || 'dark';
</script>
</head>
<body>
<div id="root" class="loading"><span class="spinner"></span> Loading the desk…</div>
<div id="overlay"></div>
<!-- Bump ?v= when support.css or app.js changes: /(.*).(js|css) in vercel.json
     gives them a one-hour cache, and a stale panel against a fresh API is a
     confusing way to spend an afternoon. -->
<script src="/staff/app.js?v=23"></script>
</body>
</html>
