      note: "割引でカードをまとめて購入したい場合は plately.eu/help から「Business」カテゴリでご連絡ください。" },
    zh: { docTitle: "兑换礼品卡 — Plately", back: "← 首页", heroTitle: "有礼品卡吗？", heroBody: "输入卡片、邮件或朋友给你的兑换码。我们会带你进入已填好兑换码的应用 — 只需登录即可。",
      title: "兑换码", lede: "“PLATELY-”之后的 12 个字符。不区分大小写；0/O 和 1/I/L 视为相同。", label: "卡片上的兑换码", hint: "在卡片背面的刮刮涂层下，或在包含礼物链接的消息中。", bad: "兑换码有 12 个字符 — 请检查是否有遗漏。", go: "进入应用 →",

  var $ = function (id) { return document.getElementById(id); };
  var lang = 'en';

  function applyLang(code) {
    lang = T[code] ? code : 'en';
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.docTitle;
    ['back', 'heroTitle', 'heroBody', 'title', 'lede', 'label', 'hint', 'go'].forEach(function (k) { $(k).textContent = t[k]; });
    $('steps').innerHTML = t.steps.map(function (s, i) { return '<li><i>' + (i + 1) + '</i><span>' + s + '</span></li>'; }).join('');
    $('note').textContent = t.note;
    $('lang').value = lang;
    if ($('err').textContent) $('err').textContent = t.bad;
    try { localStorage.setItem('plately_landing_lang', lang); } catch (e) {}
  }

  (function initLang() {
    var sel = $('lang');
    LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; o.lang = l[0]; sel.appendChild(o); });
    sel.addEventListener('change', function () { applyLang(sel.value); });
    var stored = null;
    try { stored = localStorage.getItem('plately_landing_lang'); } catch (e) {}
    var pick = stored && T[stored] ? stored : null;
    if (!pick) {
      var wants = (navigator.languages || [navigator.language || 'en']).map(function (s) { return String(s).slice(0, 2).toLowerCase(); });
      for (var i = 0; i < wants.length && !pick; i++) if (T[wants[i]]) pick = wants[i];
    }
    applyLang(pick || 'en');
  })();

  // Mirrors src/lib/programCode.ts in the app: Crockford alphabet, confusable
  // letters folded, brand prefix stripped in both of its spellings.
  var ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  var FOLD = { I: '1', L: '1', O: '0', U: 'V' };
  function normalise(raw) {
    var s = String(raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
    if (s.indexOf('PLATELY') === 0) s = s.slice(7);
    else if (s.indexOf('P1ATE1Y') === 0) s = s.slice(7);
    var out = '';
    for (var i = 0; i < s.length && out.length < 12; i++) out += FOLD[s[i]] || s[i];
    return out;
  }
  function valid(norm) {
    if (norm.length !== 12) return false;
    for (var i = 0; i < norm.length; i++) if (ALPHABET.indexOf(norm[i]) < 0) return false;
    return true;
  }
  function pretty(norm) {
    var g = norm.match(/.{1,4}/g) || [];
    return ['PLATELY'].concat(g).join('-');
  }

  var input = $('code'), go = $('go'), err = $('err');

  input.addEventListener('input', function () {
    var norm = normalise(input.value);
    input.value = norm ? pretty(norm) : '';
    go.disabled = !valid(norm);
    err.textContent = '';
  });

  // A code can arrive in the address too — from the QR on the card, from a
  // marketplace link. Filled in, never sent anywhere from here.
  try {
    var pre = new URL(location.href).searchParams.get('code');
    if (pre) { input.value = pretty(normalise(pre)); go.disabled = !valid(normalise(pre)); }
  } catch (e) {}

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var norm = normalise(input.value);
    if (!valid(norm)) { err.textContent = T[lang].bad; return; }
    location.href = APP + '?code=' + encodeURIComponent(pretty(norm));
  });
</script>
</body>
</html>
