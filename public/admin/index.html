<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plately — panel administratora</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a0b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif; min-height: 100dvh; }
  .wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 380px; background: #131316; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 28px; }
  h1 { font-size: 18px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: #8a8a92; margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #0a0a0b; color: #f4f4f5; font-size: 14px; }
  button { margin-top: 20px; width: 100%; padding: 12px; border-radius: 10px; border: none; background: #34d399; color: #04140d; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { background: transparent; border: 1px solid rgba(255,255,255,.14); color: #f4f4f5; margin-top: 10px; }
  button.danger { background: #d81e3c; color: #fff; }
  .msg { margin-top: 12px; font-size: 13px; color: #f87171; min-height: 16px; }
  .status { font-size: 13px; color: #8a8a92; margin-top: 4px; }
  .mode-badge { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .mode-live { background: rgba(52,211,153,.14); color: #34d399; }
  .mode-maintenance { background: rgba(216,30,60,.14); color: #f87171; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <h1>Plately — panel administratora</h1>
    <div id="login-view">
      <label for="u">Login</label>
      <input id="u" autocomplete="username" />
      <label for="p">Hasło</label>
      <input id="p" type="password" autocomplete="current-password" />
      <button id="login-btn">Zaloguj</button>
      <div class="msg" id="login-msg"></div>
    </div>
    <div id="panel-view" style="display:none;">
      <div class="status">Aktualny tryb strony:</div>
      <div id="mode-badge" class="mode-badge">…</div>
      <button id="live-btn">Ustaw: strona aktywna</button>
      <button id="maint-btn" class="danger">Ustaw: w budowie / maintenance</button>
      <button id="logout-btn" class="secondary">Wyloguj</button>
      <div class="msg" id="panel-msg"></div>
    </div>
  </div>
</div>
<script>
  const loginView = document.getElementById('login-view');
  const panelView = document.getElementById('panel-view');
  const loginMsg = document.getElementById('login-msg');
  const panelMsg = document.getElementById('panel-msg');
  const modeBadge = document.getElementById('mode-badge');

  function setBadge(mode) {
    modeBadge.textContent = mode === 'maintenance' ? 'W BUDOWIE' : 'AKTYWNA';
    modeBadge.className = 'mode-badge ' + (mode === 'maintenance' ? 'mode-maintenance' : 'mode-live');
  }

  async function refreshStatus() {
    const res = await fetch('/api/admin/status');
    if (res.status === 401) {
      loginView.style.display = 'block';
      panelView.style.display = 'none';
      return;
    }
    const data = await res.json();
    setBadge(data.mode);
    loginView.style.display = 'none';
    panelView.style.display = 'block';
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    loginMsg.textContent = '';
    const username = document.getElementById('u').value;
    const password = document.getElementById('p').value;
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      loginMsg.textContent = 'Błędny login lub hasło.';
      return;
    }
    refreshStatus();
  });

  async function setMode(mode) {
    panelMsg.textContent = 'Zapisywanie…';
    const res = await fetch('/api/admin/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      panelMsg.textContent = 'Błąd (' + res.status + '): ' + (data.error || 'nieznany') +
        (data.details ? ' — ' + data.details : '');
      return;
    }
    setBadge(data.mode);
    panelMsg.textContent = 'Zmieniono. Zmiana jest widoczna od razu, bez redeployu.';
  }

  document.getElementById('live-btn').addEventListener('click', () => setMode('live'));
  document.getElementById('maint-btn').addEventListener('click', () => setMode('maintenance'));
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    refreshStatus();
  });

  refreshStatus();
</script>
</body>
</html>
