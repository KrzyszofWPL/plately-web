     itself: one room for everything the card touches.

     to, and pays at the provider (api/gift/checkout raises the invoice; the
     price comes from the server, never from this page). The provider sends

     card is issued — then shows the gift link and the code, which the mail

  var $ = function (id) { return document.getElementById(id); };
  var lang = 'en', plan = 'premium', period = 'yearly';
  var PERIODS = ['monthly', 'quarterly', 'yearly'];
  // Prices come from the server (GET /api/gift/session): the number on the
  // button is the number the invoice is raised for, from one table.
  var shop = { configured: false, prices: null, days: { monthly: 31, quarterly: 92, yearly: 366 }, promoPercent: 0 };
  var ts = { siteKey: null, widget: null, token: null, pending: null };
  var busy = false;

  function t(key, vars) {
    var str = (T[lang] && T[lang][key]) || T.en[key] || key;
    if (typeof str !== 'string') return str;
    return str.replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? String(vars[k]) : m; });
  }
  function money(n) { return '$' + (Number.isInteger(n) ? String(n) : n.toFixed(2)); }
  function promo(n) { return Math.round(n * (100 - shop.promoPercent)) / 100; }
  function planName(p) { return p === 'ultra' ? 'Ultra' : 'Premium'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // --- the shop -----------------------------------------------------------------

  function draw() {
    var d = T[lang];
    document.documentElement.lang = lang;
    document.title = d.docTitle;
    ['back', 'heroTitle', 'heroBody', 'title', 'lede', 'planLabel', 'periodLabel', 'emailLabel', 'emailHint', 'verifyTitle', 'verifyBody', 'linkLabel', 'again'].forEach(function (k) { $(k).textContent = d[k]; });
    $('buy').textContent = busy ? d.buying : d.buy;
    $('copyLink').textContent = d.copy;
    $('openGift').textContent = d.openGift;
    $('points').innerHTML = d.points.map(function (s) { return '<li>' + s + '</li>'; }).join('');
    $('blurb').textContent = plan === 'ultra' ? d.ultraBlurb : d.premiumBlurb;
    document.querySelectorAll('#planSeg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.plan === plan ? 'true' : 'false'); });

    var prices = shop.prices;
    $('periods').innerHTML = PERIODS.map(function (p) {
      var sticker = prices ? prices[plan][p] : null, price = sticker === null ? null : promo(sticker);
      var per = price === null ? '…' : money(Math.round(price / (shop.days[p] / 30.4) * 100) / 100);
      var tag = p === 'yearly' ? '<span class="chip chip-ok">' + t('best') + '</span>' : p === 'quarterly' ? '<span class="chip">' + t('popular') + '</span>' : '';
      var was = sticker !== null && shop.promoPercent > 0 ? '<span class="was">' + money(sticker) + '</span><span class="chip chip-ok promo">-' + shop.promoPercent + '%</span> ' : '';
      return '<button type="button" class="period" data-period="' + p + '" aria-pressed="' + (p === period) + '">' +
        '<span class="dot" aria-hidden="true"></span>' +
        '<span><span class="days">' + t('days', { days: shop.days[p] }) + '</span>' + tag + '<span class="sub" style="display:block">' + t('perMonth', { price: per }) + '</span></span>' +
        '<span class="price">' + was + (price === null ? '…' : money(price)) + '</span></button>';
    }).join('');
    document.querySelectorAll('.period').forEach(function (b) { b.addEventListener('click', function () { period = b.dataset.period; draw(); }); });

    $('summary').innerHTML = t('summary', { plan: planName(plan), days: shop.days[period] });
    $('total').textContent = prices ? money(promo(prices[plan][period])) : '…';
    $('payNote').textContent = d.payNote;
    $('steps').innerHTML = d.steps.map(function (s, i) { return '<li><i>' + (i + 1) + '</i><span>' + s + '</span></li>'; }).join('');
    $('note').innerHTML = d.note;
    $('lang').value = lang;
    $('buy').disabled = busy || !prices;
    if (order.id) drawOrder();
  }

  document.querySelectorAll('#planSeg button').forEach(function (b) { b.addEventListener('click', function () { plan = b.dataset.plan; draw(); }); });

  function hidePanels() { $('verifyPanel').hidden = true; $('errPanel').hidden = true; $('verifyWhy').hidden = true; }
  function showVerify(why) {
    hidePanels();
    if (why) { $('verifyWhy').textContent = why; $('verifyWhy').hidden = false; }
    $('verifyPanel').hidden = false;
  }
  function showErr(kind, detail) {
    hidePanels();
    var key = { shop_off: 'errShopOff', rate_limited: 'errRate', provider_error: 'errProvider', provider_unreachable: 'errProvider', bad_email: 'errGeneric' }[kind] || 'errGeneric';
    $('errTitle').textContent = kind === 'bad_email' ? t('emailBad') : t(key);

  // --- Turnstile, the same way the gift page does it: invisible, run on the
  //     click, and the server refuses a checkout without its token. ----------

  function loadTurnstile() {
    return new Promise(function (resolve, reject) {
      if (window.turnstile && window.turnstile.render) return resolve();
      var CALLBACK = '__platelyShopTurnstile';
      var timer = setTimeout(function () { reject(new Error('turnstile did not load')); }, 12000);
      window[CALLBACK] = function () { clearTimeout(timer); resolve(); };
      var script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=' + CALLBACK;
      script.async = true; script.defer = true;
      script.onerror = function () { clearTimeout(timer); reject(new Error('turnstile blocked')); };
      document.head.appendChild(script);
    });
  }
  function settle(err, token) { var p = ts.pending; if (!p) return; ts.pending = null; clearTimeout(p.timer); if (err) p.reject(err); else p.resolve(token); }
  function mountTurnstile() {
    if (!ts.siteKey) return Promise.resolve();
    return loadTurnstile().then(function () {
      ts.widget = window.turnstile.render($('ts-widget'), {
        sitekey: ts.siteKey, theme: 'dark', size: 'flexible', action: 'gift-shop', execution: 'execute', appearance: 'interaction-only',
        callback: function (token) { ts.token = token; settle(null, token); },
        'expired-callback': function () { ts.token = null; },
        'timeout-callback': function () { settle(new Error('timeout')); },
        'error-callback': function (code) { settle(new Error(code ? String(code) : 'the check could not run')); }
      });
    });
  }
  function challenge() {
    if (!ts.siteKey) return Promise.resolve(null);
    return new Promise(function (resolve, reject) {
      var start = function () {
        if (ts.widget === null || !window.turnstile) return reject(new Error('the check is not available'));
        ts.pending = { resolve: resolve, reject: reject, timer: setTimeout(function () { settle(new Error('timeout')); }, 25000) };
        try { if (ts.token) { window.turnstile.reset(ts.widget); ts.token = null; } window.turnstile.execute(ts.widget); } catch (err) { settle(err); }
      };
      if (ts.widget === null) mountTurnstile().then(start, reject); else start();
    });
  }

  // --- buying -----------------------------------------------------------------------

  $('buy').addEventListener('click', function () {
    if (busy || !shop.prices) return;
    hidePanels();
    var email = String($('email').value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr('bad_email'); $('email').focus(); return; }
    if (!shop.configured) { showErr('shop_off'); return; }
    busy = true; draw();
    challenge().then(function (token) {
      return fetch('/api/gift/checkout', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan: plan, period: period, email: email, lang: lang, turnstileToken: token })
      }).then(function (res) { return res.json().catch(function () { return {}; }).then(function (d) { return { status: res.status, data: d }; }); });
    }).then(function (r) {
      busy = false; draw();
      var d = r.data || {};
      if (r.status === 403 && d.error === 'verification') return showVerify(d.reason);
      if (r.status >= 200 && r.status < 300 && d.checkoutUrl) {
        try { localStorage.setItem('plately_gift_order', d.orderId); } catch (e) {}
        location.href = d.checkoutUrl;
        return;
      }
      showErr(d.error || 'generic', d.detail);
    }).catch(function (err) {
      busy = false; draw();
      var msg = err && err.message ? err.message : String(err);
      if (/failed to fetch|networkerror|load failed/i.test(msg)) return showErr('generic');
      showVerify(msg);
    });
  });

  // --- the order view -----------------------------------------------------------------
  //
  // The provider sends the buyer back to /giftcards?order=<id>. The id is a
  // random UUID only the buyer has, and the page polls it until the card is
  // issued — a crypto payment can take minutes to confirm.

  var order = { id: null, data: null, cancelled: false, timer: null, polls: 0 };

  function drawOrder() {
    var d = order.data;
    $('shopView').hidden = true;
    $('orderView').hidden = false;
    $('orderTitle').textContent = t('orderTitle');
    var status = d && d.found ? d.status : (d ? 'missing' : 'pending');
    if (order.cancelled && status === 'pending') status = 'cancelled';
    var keys = { pending: 'stPending', confirming: 'stConfirming', paid: 'stPaid', failed: 'stFailed', expired: 'stExpired', refunded: 'stRefunded', cancelled: 'stCancelled', missing: 'stMissing' };
    $('orderText').textContent = t(keys[status] || 'stPending');
    var box = $('orderStatus');
    box.className = 'status' + (status === 'paid' ? ' ok' : (status === 'failed' || status === 'expired' || status === 'missing' || status === 'cancelled') ? ' bad' : '');
    $('orderSpin').hidden = !(status === 'pending' || status === 'confirming');
    $('orderLede').textContent = status === 'paid' ? t('orderLedePaid') : t('orderLedePending');
    var paid = status === 'paid' && d.link;
    $('orderPaid').hidden = !paid;
    if (paid) {
      $('orderLink').textContent = d.link;
      $('openGift').href = d.link;
      $('codeLine').innerHTML = d.code ? t('codeLine', { code: esc(d.code) }) : '';
      $('mailedLine').textContent = d.mailed ? t('mailed', { email: d.email || '' }) : t('mailedNot');
    }
  }

  function pollOrder() {
    fetch('/api/gift/order?id=' + encodeURIComponent(order.id), { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        order.data = d;
        drawOrder();
        var s = d && d.found ? d.status : 'missing';
        // Keep asking while the money can still arrive; give up after an hour.
        if ((s === 'pending' || s === 'confirming') && ++order.polls < 900) order.timer = setTimeout(pollOrder, s === 'confirming' ? 3000 : 5000);
      })
      .catch(function () { order.timer = setTimeout(pollOrder, 8000); });
  }

  $('copyLink').addEventListener('click', function () {
    var link = $('orderLink').textContent;
    if (!link) return;
    var done = function () { $('copyLink').textContent = t('copied'); setTimeout(function () { $('copyLink').textContent = t('copy'); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, done); else done();
  });

  // --- boot --------------------------------------------------------------------------

  (function initLang() {
    var sel = $('lang');
    LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; o.lang = l[0]; sel.appendChild(o); });
    sel.addEventListener('change', function () { lang = sel.value; try { localStorage.setItem('plately_landing_lang', lang); } catch (e) {} draw(); });
    var stored = null;
    try { stored = localStorage.getItem('plately_landing_lang'); } catch (e) {}
    var pick = stored && T[stored] ? stored : null;
    if (!pick) {
      var wants = (navigator.languages || [navigator.language || 'en']).map(function (s) { return String(s).slice(0, 2).toLowerCase(); });
      for (var i = 0; i < wants.length && !pick; i++) if (T[wants[i]]) pick = wants[i];
    }
    lang = pick || 'en';
    try {
      var u = new URL(location.href);
      if (/^(premium|ultra)$/.test(u.searchParams.get('plan') || '')) plan = u.searchParams.get('plan');
      if (/^(monthly|quarterly|yearly)$/.test(u.searchParams.get('period') || '')) period = u.searchParams.get('period');
      var o = String(u.searchParams.get('order') || '').toLowerCase();
      if (/^[0-9a-f-]{36}$/.test(o)) { order.id = o; order.cancelled = u.searchParams.get('cancel') === '1'; }
    } catch (e) {}
    draw();
    if (order.id) { drawOrder(); pollOrder(); }
  })();

  fetch('/api/gift/session', { headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      ts.siteKey = data.turnstileSiteKey || null;
      if (data.shop) { shop.configured = Boolean(data.shop.configured); shop.prices = data.shop.prices || null; shop.days = data.shop.days || shop.days; shop.promoPercent = Number(data.shop.promoPercent) || 0; }
      draw();
      return mountTurnstile();
    })
    .catch(function () { draw(); });
</script>
</body>
</html>
