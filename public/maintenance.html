<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przerwa techniczna · Plately</title>
<!-- Served with HTTP 503 by middleware.js, never 200 — see the comment there
     for why that distinction is the difference between "come back later" and
     a soft 404 in Search Console. -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/error.css">
</head>
<body data-code="503">
  <main class="pl-err">
    <div class="pl-halo" aria-hidden="true"></div>
    <div class="pl-inner">
      <span class="pl-logo">
        <img src="/logo.png" alt="Plately" width="72" height="72">
      </span>
      <p class="pl-code" aria-hidden="true">503</p>
      <h1 data-i18n="title">Chwilowo niedostępne</h1>
      <p class="pl-lead" data-i18n="lead">Prowadzimy prace nad serwisem. Aplikacja działa normalnie — wróć tu za jakiś czas.</p>
      <div class="pl-actions">
        <a href="https://app.plately.eu/" class="pl-btn pl-btn-primary" data-i18n="app">Otwórz aplikację</a>
      </div>
      <p class="pl-meta"><span data-i18n="errLabel">Błąd</span> <span class="pl-mono">503 · SERVICE_UNAVAILABLE</span></p>
    </div>
  </main>
<script src="/error.js" defer></script>
</body>
</html>
